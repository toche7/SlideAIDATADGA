<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#99add6" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a66b3" />
    </marker>
    <style>
      .title { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 48px; font-weight: 700; fill: #193b75; }
      .subtitle { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 25px; font-weight: 500; fill: #355a99; }
      .num { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
      .h { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 28px; font-weight: 700; fill: #173a74; }
      .t { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 22px; font-weight: 500; fill: #224f96; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <text x="800" y="86" text-anchor="middle" class="title">Workflow: Data Analysis with LLM</text>
  <text x="800" y="126" text-anchor="middle" class="subtitle">จากข้อมูลดิบสู่ข้อเสนอเชิงนโยบาย</text>

  <g filter="url(#shadow)">
    <rect x="80" y="220" width="260" height="260" rx="24" fill="url(#step)" stroke="#d3dff5"/>
    <circle cx="210" cy="270" r="33" fill="#2d66c3"/>
    <text x="210" y="282" text-anchor="middle" class="num">1</text>
    <text x="210" y="340" text-anchor="middle" class="h">เตรียมข้อมูล</text>
    <text x="210" y="380" text-anchor="middle" class="t">ให้ข้อมูล และ Prompt</text>
    <text x="210" y="412" text-anchor="middle" class="t">ที่ชัดเจนเพื่อการวิเคราะห์</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="220" width="260" height="260" rx="24" fill="url(#step)" stroke="#d3dff5"/>
    <circle cx="510" cy="270" r="33" fill="#2d66c3"/>
    <text x="510" y="282" text-anchor="middle" class="num">2</text>
    <text x="510" y="340" text-anchor="middle" class="h">สร้างโค้ด</text>
    <text x="510" y="380" text-anchor="middle" class="t">LLM สร้าง Python Code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="220" width="260" height="260" rx="24" fill="url(#step)" stroke="#d3dff5"/>
    <circle cx="810" cy="270" r="33" fill="#2d66c3"/>
    <text x="810" y="282" text-anchor="middle" class="num">3</text>
    <text x="810" y="340" text-anchor="middle" class="h">ประมวลผล</text>
    <text x="810" y="380" text-anchor="middle" class="t">LLM Run Python Code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="220" width="260" height="260" rx="24" fill="url(#step)" stroke="#d3dff5"/>
    <circle cx="1110" cy="270" r="33" fill="#2d66c3"/>
    <text x="1110" y="282" text-anchor="middle" class="num">4</text>
    <text x="1110" y="340" text-anchor="middle" class="h">ผลลัพธ์</text>
    <text x="1110" y="380" text-anchor="middle" class="t">ได้ผลลัพธ์เป็นตัวเลข</text>
    <text x="1110" y="412" text-anchor="middle" class="t">และกราฟ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1280" y="220" width="260" height="260" rx="24" fill="url(#step)" stroke="#d3dff5"/>
    <circle cx="1410" cy="270" r="33" fill="#2d66c3"/>
    <text x="1410" y="282" text-anchor="middle" class="num">5</text>
    <text x="1410" y="340" text-anchor="middle" class="h">สรุปเชิงนโยบาย</text>
    <text x="1410" y="380" text-anchor="middle" class="t">LLM สรุปเป็น Insight</text>
    <text x="1410" y="412" text-anchor="middle" class="t">และข้อเสนอแนะเชิงนโยบาย</text>
  </g>

  <line x1="345" y1="350" x2="375" y2="350" stroke="#3a66b3" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="645" y1="350" x2="675" y2="350" stroke="#3a66b3" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="945" y1="350" x2="975" y2="350" stroke="#3a66b3" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1245" y1="350" x2="1275" y2="350" stroke="#3a66b3" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="120" y="760" width="1360" height="86" rx="16" fill="#eaf1ff" stroke="#bfd0f2"/>
  <text x="800" y="813" text-anchor="middle" class="subtitle">Human Verification: ตรวจความถูกต้องของข้อมูล โค้ด และการตีความทุกขั้นก่อนใช้งานจริง</text>
</svg>
